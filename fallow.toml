# Fallow (dead-code / dependency audit) configuration.

# Packages installed up front for the v2 rebuild (dashboard, auth emails,
# markdown post writer, RSS/sitemap) that no source file imports yet.
# Remove a name from this list as soon as the feature that uses it lands,
# so fallow starts tracking it again.
ignoreDependencies = [
  # Markdown rendering pipeline for DB-stored posts
  "@astrojs/markdown-remark",
  "@shikijs/rehype",
  "gray-matter",
  "marked",
  "rehype-sanitize",
  "rehype-slug",
  "rehype-stringify",
  "remark-gfm",
  "remark-parse",
  "remark-rehype",
  "unified",
  "slugify",
  # Post editor
  "codemirror",
  "@codemirror/lang-markdown",
  "@codemirror/language-data",
  "@codemirror/state",
  "@codemirror/theme-one-dark",
  "@codemirror/view",
  "@tiptap/core",
  "@tiptap/react",
  "@tiptap/starter-kit",
  # React islands + styling
  "react",
  "react-dom",
  "@astrojs/react",
  "eslint-plugin-jsx-a11y",
  "tailwindcss",
  "@tailwindcss/vite",
  # Used by astro.config.mjs, which fallow does not count as production code
  "@astrojs/mdx",
  "@astrojs/vercel",
  # Site plumbing
  "@astrojs/node",
  "@astrojs/rss",
  "@astrojs/sitemap",
  "@vercel/analytics",
  "date-fns",
  "nanoid",
  "resend",
  "zod",
]

[duplicates]
# Generated by `pnpm auth:generate`; its repeated column blocks are not ours to refactor.
ignore = ["src/db/auth-schema.ts"]
